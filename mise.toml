# Monorepo: each app has its own mise.toml with its tasks; tools and settings here are shared.
#   mise run //prayer-times-watchface:build     (or `mise run :build` inside the folder)
#   mise tasks --all                            lists every project's tasks
monorepo_root = true

[monorepo]
config_roots = ["prayer-times-watchface", "prayer-location-app", "daad-keyboard", "sleep-time", "qistas"]

# App IDs registered on the Zepp developer console. :gen writes them into each app.json, and the
# companion's into the face's lib/app-ids.js (scripts/app-ids.py); zeus can't read env vars itself.
[env]
PRAYER_TIMES_APP_ID = "1136165"
# the face's other store listings, one per screen size (prayer-times-watchface/tools/store-build.py)
PRAYER_TIMES_APP_ID_SQUARE_390X450 = "1136433"
PRAYER_TIMES_APP_ID_ROUND_480 = "1136434"
PRAYER_TIMES_APP_ID_ROUND_466 = "1136440"
PRAYER_LOCATION_APP_ID = "1136166"
DAAD_KEYBOARD_APP_ID = "1136372"
SLEEP_TIME_APP_ID = "1136529"
QISTAS_APP_ID = "1136625"

# Python for the image generators (shared/text_draw.py: HarfBuzz + FreeType), for every project's
# tasks. Wheels only (--no-build), pinned so the output is the same on macOS and Linux.
[vars]
# Pillow only, for the icons and the generated-files check
py = "uv run -q --no-project --no-build --with pillow==13.0.0 python3 -I"
py_img = "uv run -q --no-project --no-build --with pillow==13.0.0 --with freetype-py==2.5.1 --with uharfbuzz==0.57.0 python3 -I"

# The build steps every app shares: `[tasks.build] extends = "zeus-build"` in the app's mise.toml.
# zeus packs a copy of the project source (.ip-package) into the .zab so the Zepp store can rebuild for
# other devices; it never reaches the watch. :build prunes it for sideloading (Gadgetbridge, GitHub
# releases); :build-store keeps it. :ci (.github/workflows) also fails if the files the app lists in
# vars.generated are out of date (PNGs compared by pixels, scripts/check-generated.py).
[task_templates.zeus-build]
description = "Regenerate, test, and build a lean .zab for sideloading (no source archive)"
depends = [":gen", ":test"]
run = ["zeus build", "zeus prune --ip"]

[task_templates.zeus-store]
description = "Like :build, but keep zeus's source archive for a Zepp store submission"
depends = [":gen", ":test"]
run = "zeus build"

[task_templates.zeus-ci]
description = "Regenerate and check the committed generated files, test, and build a lean .zab (CI)"
depends = [":gen", ":test"]
run = ["{{vars.py}} ../scripts/check-generated.py {{vars.generated}}", "zeus build", "zeus prune --ip"]

[tools]
node = "26"
pnpm = "12"
"npm:@zeppos/zeus-cli" = "1.10.0"

[tools."http:zepp-simulator"]
version = "2.1.2"
url = "https://upload-cdn.zepp.com/zepp-applet-and-wechat-applet/20260717/simulator-{{ version }}-macos-arm64.dmg"
checksum = "sha256:a773f4f8bc7411418c80999241dba5824f4303eb438b0b411976d11aa479e592"
bin = "simulator.dmg"
postinstall = 'bash "$MISE_CONFIG_ROOT/scripts/install-simulator.sh"'
os = ["macos"]

[settings]
npm.package_manager = "pnpm"

[tasks.simulator]
description = "Launch the mise-managed Zepp OS Simulator"
run = 'open "$(mise where http:zepp-simulator)/simulator.app"'
