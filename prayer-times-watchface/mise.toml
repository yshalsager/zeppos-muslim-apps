# Prayer Times watchface. Tasks run in this folder; node, pnpm and zeus come from the root mise.toml.
#   mise run :build   regenerates everything, tests, and builds dist/*.zab
# The Python tools run under uv with their dependencies, so no global Python packages are needed.
# The image generators shape Arabic with uharfbuzz and draw it with freetype-py (tools/render.py), so
# plain wheels are enough and the output is the same on macOS and Linux. Versions are pinned for that.

[tools]
uv = "latest"

[vars]
# Python with the generators' dependencies; wheels only (--no-build), so a locally built Pillow is never used
py_font = "uv run -q --no-project --no-build --with fonttools==4.68.0 --with uharfbuzz==0.57.0 python3 -I"

[tasks.deps]
description = "Install the JavaScript dependencies (adhan), used by the tests and the generators"
run = "pnpm install --frozen-lockfile --silent"

[tasks.gen]
description = "Write the app IDs, and regenerate the Hijri table, language files, font, edit previews, date-line widths, picker preview and README screenshots"
depends = [":deps"]
run = [
  "python3 -I ../scripts/app-ids.py prayer-times-watchface",
  "node tools/gen-hijri-table.mjs",
  "node tools/gen-i18n.mjs",
  "../scripts/fetch-fonts.sh",
  "{{vars.py_font}} tools/gen-font.py ../.cache/fonts/ScheherazadeNew-Medium.ttf ../.cache/fonts/NotoSans.ttf ../.cache/fonts/NotoSansArabic.ttf",
  "{{vars.py_img}} tools/gen-edit-assets.py",
  "{{vars.py_img}} tools/gen-text-width.py",
  "{{vars.py_img}} tools/gen-preview.py",
  "{{vars.py_img}} tools/gen-docs.py",
  # store previews for the face's other store listings (one per screen size, see tools/store-build.py)
  "ZOS_TARGET=square-390x450 DOCS_OUT=../docs/watchface/square-390x450 STORE_ONLY=1 {{vars.py_img}} tools/gen-docs.py",
  # every round listing takes 360x360 previews, whatever the watch's size
  "ZOS_TARGET=round-360 DOCS_OUT=../docs/watchface/round STORE_ONLY=1 {{vars.py_img}} tools/gen-docs.py",
]

# Not part of :gen: downloads ~210 MB from GeoNames, which changes daily. Output is committed.
[tasks.gen-cities]
description = "Rebuild the city list (assets/<target>/cities) from GeoNames, then regenerate the font"
run = [
  "tools/fetch-geonames.sh",
  "uv run -q --no-project --no-build --with babel==2.17.0 python3 -I tools/gen-cities.py",
  "mise run :gen",
]

[tasks.test]
description = "Verify the prayer/Hijri math and countdown logic"
depends = [":deps"]
wait_for = [":gen"] # tasks depending on both (:build, :ci) run their tests on the regenerated files
run = "pnpm -s test"

# zeus packs a copy of the project source (.ip-package) into the .zab so the Zepp store can rebuild
# for other devices; it never reaches the watch. :build prunes it for sideloading (Gadgetbridge,
# GitHub releases); :build-store keeps it, and builds one package per screen size that has a store
# listing, since a listing takes only one size (tools/store-build.py).
[tasks.build]
description = "Regenerate assets, run the tests, and build a lean watchface .zab (no source archive)"
depends = [":gen", ":test"]
run = ["zeus build", "zeus prune --ip"]

[tasks.build-store]
description = "Store packages: ../dist/prayer-times-watchface/*-<target>.zab for each target with a store listing, keeping zeus's source archive"
depends = [":gen", ":test"]
run = "python3 -I tools/store-build.py"

# CI (.github/workflows): everything :build does, and fail if the committed generated files are out
# of date (compared by pixels for PNGs, see scripts/check-generated.py).
[tasks.ci]
description = "Regenerate and check the committed assets, run the tests, and build a lean .zab (CI)"
depends = [":gen", ":test"]
run = [
  "{{vars.py_img}} ../scripts/check-generated.py prayer-times-watchface/app.json prayer-times-watchface/lib/app-ids.js prayer-times-watchface/assets prayer-times-watchface/lib/edit-options.js prayer-times-watchface/lib/weather-icons.js prayer-times-watchface/lib/hijri-table.js prayer-times-watchface/lib/text-width.js docs/watchface",
  "zeus build",
  "zeus prune --ip",
]
