# Shared Zeus CLI and Node versions, the Python commands and the build tasks come from ../mise.toml.

[tools]
uv = "latest"

[vars]
generated = "daad-keyboard/app.json daad-keyboard/assets docs/daad-keyboard" # checked by :ci

[tasks.gen]
description = "Write the app ID, and regenerate the app icon and the store previews (fonts and text drawing from ../shared)"
run = [
  "python3 -I ../scripts/app-ids.py daad-keyboard",
  "python3 -I ../scripts/targets.py daad-keyboard",
  "../scripts/fetch-fonts.sh",
  "{{vars.py}} tools/gen-icon.py",
  "{{vars.py_img}} tools/gen-previews.py",
]

[tasks.test]
description = "Test the text helpers and the package"
wait_for = [":gen"] # :build and :ci test the regenerated icons
run = "node --test test/*.test.js ../shared/package.test.mjs"

[tasks.build]
extends = "zeus-build"

[tasks.build-store]
extends = "zeus-store"

[tasks.ci]
extends = "zeus-ci"
