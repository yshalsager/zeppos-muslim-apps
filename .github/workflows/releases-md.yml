name: RELEASES.md

# Regenerates RELEASES.md (each app's latest release and its history, .github/scripts/releases.py)
# and commits it to master when it changed. Runs after the Release workflow has attached the .zab,
# when a release is edited or deleted, and by hand.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: releases-md
  cancel-in-progress: false

jobs:
  update:
    name: Update RELEASES.md
    runs-on: ubuntu-latest
    permissions:
      contents: write # push RELEASES.md to master
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/releases.py > /dev/null
      - name: Commit if changed
        run: |
          git diff --quiet -- RELEASES.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASES.md
          git commit -m "docs: update RELEASES.md [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
