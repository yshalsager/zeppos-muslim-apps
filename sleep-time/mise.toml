# Shared Zeus CLI and Node versions, the Python commands and the build tasks come from ../mise.toml.

[tools]
uv = "latest"

[vars]
generated = "sleep-time/app.json sleep-time/assets docs/sleep-time" # checked by :ci

[tasks.gen]
description = "Write the app ID, and regenerate the app icon and the preview images (fonts and text drawing from ../shared)"
run = [
  "python3 -I ../scripts/app-ids.py sleep-time",
  "python3 -I ../scripts/targets.py sleep-time",
  "../scripts/fetch-fonts.sh",
  "{{vars.py}} tools/gen-icon.py",
  "{{vars.py_img}} tools/gen-previews.py",
]

[tasks.test]
description = "Test the sleep maths, the layout on every screen, the pages and the package"
wait_for = [":gen"] # :build and :ci test the regenerated icons
run = "node --test test/*.test.js ../shared/package.test.mjs"

[tasks.build]
extends = "zeus-build"

[tasks.build-store]
extends = "zeus-store"

[tasks.ci]
extends = "zeus-ci"
