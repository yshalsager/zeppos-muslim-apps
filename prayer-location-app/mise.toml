# Location companion. node, pnpm, zeus, the Python commands and the build tasks come from ../mise.toml.

[tools]
uv = "latest"

[vars]
generated = "prayer-location-app/app.json prayer-location-app/assets" # checked by :ci

[tasks.gen]
description = "Write the app ID and regenerate the app icon"
run = ["python3 -I ../scripts/app-ids.py prayer-location-app", "{{vars.py}} tools/gen-icon.py"]

# No tests yet
[tasks.build]
extends = "zeus-build"
depends = [":gen"]

[tasks.build-store]
extends = "zeus-store"
depends = [":gen"]

[tasks.ci]
extends = "zeus-ci"
depends = [":gen"]
