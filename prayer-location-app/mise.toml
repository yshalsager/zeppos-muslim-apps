# Location companion. node, pnpm and zeus come from the root mise.toml.

[tools]
uv = "latest"

[vars]
# Pillow wheel only (--no-build), pinned so the icon is drawn the same everywhere
py = "uv run -q --no-project --no-build --with pillow==13.0.0 python3 -I"

[tasks.gen]
description = "Regenerate the app icon"
run = "{{vars.py}} tools/gen-icon.py"

# :build prunes zeus's source archive (.ip-package) for sideloading; :build-store keeps it.
[tasks.build]
description = "Build a lean location companion .zab (no source archive)"
depends = [":gen"]
run = ["zeus build", "zeus prune --ip"]

[tasks.build-store]
description = "Like :build, but keep zeus's source archive for a Zepp store submission"
depends = [":gen"]
run = "zeus build"

# CI (.github/workflows): :build, and fail if the committed icon is out of date
[tasks.ci]
description = "Regenerate and check the icon, and build a lean .zab (CI)"
depends = [":gen"]
run = ["{{vars.py}} ../scripts/check-generated.py prayer-location-app/assets", "zeus build", "zeus prune --ip"]
